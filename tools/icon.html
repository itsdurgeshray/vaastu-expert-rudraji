<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site icon</title>
<!-- Source for assets/icon-512.png and assets/apple-touch-icon.png. Render at 512x512 with headless Chrome, same as og-card.html. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:512px;height:512px;overflow:hidden}
.icon{width:512px;height:512px;background:radial-gradient(70% 70% at 50% 40%,#8A2433 0%,#5E1622 70%,#4A111B 100%);display:grid;place-items:center}
svg{width:512px;height:512px}
</style>
</head>
<body>
<div class="icon">
  <svg viewBox="0 0 512 512">
    <circle cx="256" cy="256" r="206" fill="none" stroke="#E8C39B" stroke-width="4" opacity=".75"/>
    <circle cx="256" cy="256" r="192" fill="none" stroke="#E8C39B" stroke-width="1.5" opacity=".5"/>
    <svg id="om" x="136" y="136" width="240" height="240" viewBox="0 -80 100 100"><text x="0" y="0" font-size="100" font-family="Noto Serif Devanagari" font-weight="500" fill="#FBE6D2">ॐ</text></svg>
  </svg>
</div>
<script>
document.fonts.load('500 100px "Noto Serif Devanagari"', 'ॐ').then(() => {
  const c = document.createElement('canvas').getContext('2d');
  c.font = '500 100px "Noto Serif Devanagari"';
  const m = c.measureText('ॐ');
  document.getElementById('om').setAttribute('viewBox', `${-m.actualBoundingBoxLeft} ${-m.actualBoundingBoxAscent} ${m.actualBoundingBoxLeft + m.actualBoundingBoxRight} ${m.actualBoundingBoxAscent + m.actualBoundingBoxDescent}`);
});
</script>
</body>
</html>
